<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lele Clinic - Registration &amp; Outpatient System</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = { theme: { extend: {
      fontFamily: { sans: ['Figtree', 'ui-sans-serif', 'system-ui', 'sans-serif'] },
      colors: { pine: { 50:'#EAF4F1', 100:'#D3E8E2', 600:'#1B6B63', 700:'#14554F', 800:'#0F4440', 900:'#0A2F2C' } }
    } } };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.441.0/dist/umd/lucide.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <link rel="stylesheet" href="style.css?v=3" />
</head>
<body class="bg-[#F6F8F7] text-slate-800 font-sans min-h-screen">
  <div id="app" class="min-h-screen">
    <div class="flex items-center justify-center min-h-screen text-slate-500">Loading clinic system...</div>
  </div>
  <div id="modal-root"></div>
  <div id="toast-root" class="fixed top-4 right-4 z-[100] flex flex-col gap-2 w-80 max-w-[calc(100vw-2rem)]"></div>
  <noscript>This application requires JavaScript.</noscript>
  <script type="module" src="app.js?v=3"></script>

</html>
