# Nginx: static frontend + reverse proxy for /api/*
# Mounted read-only into the stock nginx:alpine image (replaces /etc/nginx/nginx.conf).

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;
    sendfile      on;
    keepalive_timeout 65;

    # Log to stdout/stderr so `docker compose logs nginx` works.
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Per-client rate limit for the API (dashboard polls a few times per second at most).
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    server {
        listen 80;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Basic hardening headers.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # ---- API reverse proxy ------------------------------------------------
        location /api/ {
            # Docker's embedded DNS. Using a variable in proxy_pass makes nginx
            # re-resolve "backend" at request time, so it keeps working when the
            # backend container is recreated with a new IP address.
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $backend_upstream http://backend:3000;

            limit_req zone=api_limit burst=40 nodelay;
            limit_req_status 429;
            client_max_body_size 16k;

            # No URI part on proxy_pass => the original /api/... path is forwarded unchanged.
            proxy_pass $backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 5s;
            proxy_read_timeout    30s;

            # Never cache live telemetry.
            add_header Cache-Control "no-store" always;
        }

        # ---- Static frontend ------------------------------------------------------
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        }
    }
}
