name: iot-sensor-hub

services:
  # --------------------------------------------------------------------------
  # PostgreSQL - persistent storage for sensor readings
  # --------------------------------------------------------------------------
  db:
    image: postgres:alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sensor_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_env}
      POSTGRES_DB: ${POSTGRES_DB:-sensors}
      # Explicit PGDATA + volume mounted one level up works for every Postgres
      # major version (18+ images moved the default data path).
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata:/var/lib/postgresql
      # Runs once, on first initialisation of an empty data directory.
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      # $$ stops Compose from interpolating; the variables are expanded inside the container.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    networks:
      - backend_net

  # --------------------------------------------------------------------------
  # Backend API (Node.js / Express)
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      target: runtime
    image: iot-sensor-hub/backend:1.0
    init: true
    restart: unless-stopped
    environment:
      PORT: "3000"
      DB_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-sensor_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_env}
      POSTGRES_DB: ${POSTGRES_DB:-sensors}
      RETENTION_HOURS: ${RETENTION_HOURS:-24}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - edge_net      # reachable by nginx and the simulator
      - backend_net   # reaches the database

  # --------------------------------------------------------------------------
  # IoT simulator - virtual devices, no hardware required
  # --------------------------------------------------------------------------
  simulator:
    build:
      context: ./simulator
    image: iot-sensor-hub/simulator:1.0
    init: true
    restart: unless-stopped
    environment:
      API_URL: http://backend:3000
      MIN_INTERVAL_MS: ${SIM_MIN_INTERVAL_MS:-3000}
      MAX_INTERVAL_MS: ${SIM_MAX_INTERVAL_MS:-5000}
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - edge_net

  # --------------------------------------------------------------------------
  # Nginx - static dashboard + reverse proxy (the only published port)
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 5
    security_opt:
      - no-new-privileges:true
    networks:
      - edge_net

networks:
  # Nginx <-> backend <-> simulator
  edge_net:
    driver: bridge
  # Backend <-> database. `internal: true` = no route to the outside world.
  backend_net:
    driver: bridge
    internal: true

volumes:
  pgdata:
